<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Regma IT AB — logo</title>
  <desc>The Regma IT wordmark: "Regma" in off-white and "IT" in teal, on the brand's near-black background.</desc>
  <!-- Single-logo version of the brand sheet, matching what the site header
       actually renders: Inter 800, tight tracking, teal "IT". -->
  <rect width="1200" height="400" rx="48" fill="#0d0d10"/>
  <text x="600" y="215" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="132" font-weight="800" letter-spacing="-3" fill="#f0f0f2">Regma<tspan dx="26" fill="#1D9E75">IT</tspan></text>
  <text x="600" y="285" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="500" letter-spacing="7" fill="#72728a">IT-KONSULT · GÖTEBORG</text>
</svg>
